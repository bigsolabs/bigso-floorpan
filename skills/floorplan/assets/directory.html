<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={root:'',rootName:'',workspaceId:'',workspaces:[],maps:[]},selected=null,collapsedFolders=new Set(),closed=matchMedia('(max-width:700px)').matches;

function treeModel(){const root={children:{},maps:[]};for(const m of state.maps){let n=root;for(const p of(m.projectPath==='.'?[]:m.projectPath.split('/'))){n.children[p]??={children:{},maps:[]};n=n.children[p]}n.maps.push(m)}const count=document.querySelector('#treeCount');if(count)count.textContent=`${state.maps.length} ${state.maps.length===1?'project':'projects'}`;return root}
function countTree(n){return n.maps.length+Object.values(n.children).reduce((total,child)=>total+countTree(child),0)}
function treeHTML(n,prefix=''){let h='';for(const [name,c]of Object.entries(n.children).sort(([a],[b])=>a.localeCompare(b))){const full=prefix?`${prefix}/${name}`:name,key=encodeURIComponent(full),isCollapsed=collapsedFolders.has(key);h+=`<div class="tree-branch"><button type="button" class="tree-folder" data-folder="${key}" aria-expanded="${!isCollapsed}" aria-label="${isCollapsed?'Expand':'Collapse'} ${esc(name)}"><span class="chevron" aria-hidden="true">⌄</span><span class="label">${esc(name)}</span><span class="tree-count">${countTree(c)}</span></button><div class="tree-children" data-branch="${key}"${isCollapsed?' hidden':''}>${treeHTML(c,full)}</div></div>`}for(const m of n.maps)h+=`<button type="button" class="row tree-map ${selected===m.id?'active':''}" data-map="${m.id}" title="${esc(m.name)}" aria-current="${selected===m.id?'page':'false'}"><span class="label">${esc(m.name)}</span></button>`;return h}
document.querySelector('#tree').addEventListener('click',e=>{const button=e.target.closest('[data-folder]');if(!button)return;const key=button.dataset.folder,expanded=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(expanded));button.setAttribute('aria-label',`${expanded?'Collapse':'Expand'} ${button.querySelector('.label').textContent}`);button.nextElementSibling.hidden=!expanded;if(expanded)collapsedFolders.delete(key);else collapsedFolders.add(key)});

function render(){const picker=document.querySelector('#workspaceSelect');picker.innerHTML=state.workspaces.map(w=>`<option value="${esc(w.id)}" ${w.id===state.workspaceId?'selected':''}>${esc(w.name)}</option>`).join('');picker.disabled=state.workspaces.length<2;document.querySelector('#tree').setAttribute('aria-busy','false');document.querySelector('#tree').innerHTML=`<div class="row ${selected===null?'active':''}" data-home="1"><span class="label">${esc(state.rootName||'Workspace root')}</span></div>${treeHTML(treeModel())}`;document.querySelector('#tree').onclick=e=>{const r=e.target.closest('[data-map],[data-home]');if(!r)return;if(r.dataset.home){selected=null;render();return}const m=state.maps.find(x=>x.id===r.dataset.map);selected=m.id;location.href=m.running?`/map/${m.id}`:`/map/${m.id}/static/`};if(selected)return;let c=document.querySelector('#content');c.setAttribute('aria-busy','false');c.innerHTML=`<section class="welcome"><div class="eyebrow">Project launcher</div><h1>Your codebase maps,<br>all in one place.</h1><p>Choose a project from the tree or open one of your existing Floorplan maps. This root is a launcher; no diagram is shown until you select a project.</p><div class="stats"><span><strong>${state.maps.length}</strong> ${state.maps.length===1?'map':'maps'}</span><span>Root <strong>${esc(state.rootName||'not configured')}</strong></span></div><section class="section"><div class="sectionhead"><div class="sectiontitle">Projects</div><span class="path">${esc(state.root)}</span></div>${state.maps.length?`<div class="cards">${state.maps.map(card).join('')}</div>`:`<div class="empty"><strong>No Floorplan maps yet</strong>Set a parent folder containing projects with a generated <code>floorplan/</code> map. You can configure it from the gear button.</div>`}</section></section>`;c.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api('/api/maps',{method:'POST',body:JSON.stringify({action:b.dataset.action,id:b.data async function refresh(){try{state=await api('/api/directory')}catch(e){if(!window.FLOORPLAN_DIRECTORY)throw e;state={...window.FLOORPLAN_DIRECTORY,maps:window.FLOORPLAN_DIRECTORY.maps.map(m=>({...m,running:false}))}}render()}
function settings(add=false){
  const r=document.querySelector('#drawerRoot'),current=state.workspaces.find(w=>w.id===state.workspaceId);
  r.innerHTML=`<div class="shade" id="shade"></div><section class="drawer" role="dialog" aria-modal="true"><div style="display:flex;justify-content:space-between"><div><h2>${add?'Add workspace':'Workspace settings'}</h2><p>${add?'Add another folder to your Floorplan launcher.':'Choose the folder Floorplan should scan for existing maps.'}</p></div><button class="icon" id="close" aria-label="Close settings">×</button></div><label class="fieldlabel" for="workspaceName">Workspace name</label><input class="field" id="workspaceName" value="${add?'':esc(state.rootName)}" placeholder="My projects"><label class="fieldlabel" for="rootPath">Parent folder path</label><div style="display:flex;gap:8px"><input class="field" id="rootPath" value="${add?'':esc(state.root)}" placeholder="/Users/you/Development"><button class="secondary" id="browse" type="button">Browse…</button></div><div class="hint">Subfolders are scanned for <code>floorplan/graph.json</code>. Hidden folders and dependencies are skipped.</div><div class="actions2"><button class="primary" id="save">${add?'Add workspace':'Save and rescan'}</button><button class="secondary" id="cancel">Cancel</button></div><div class="notice" id="notice"></div>${!add?`<div class="danger-zone"><div class="danger-title">Remove workspace</div><p class="danger-copy">Remove “${esc(current?.name||'')}” from Floorplan. Its folder and files will not be deleted.</p><button class="danger" id="removeWorkspace" ${state.workspaces.length<2?'disabled title="At least one workspace must remain"':''}>Remove workspace</button></div>`:''}</section>`;
  const close=()=>r.innerHTML='';r.querySelector('#close').onclick=close;r.querySelector('#cancel').onclick=close;r.querySelector('#shade').onclick=close;
  if(!add)r.querySelector('#notice').insertAdjacentHTML('afterend',`<div class="settings-file"><div class="settings-file-copy"><strong>Workspace configuration</strong><code>${esc(state.settingsPath||'')}</code></div><button type="button" id="openSettingsFile">Open file ↗</button></div>`);
  r.querySelector('#openSettingsFile')?.addEventListener('click',async()=>{const b=r.querySelector('#openSettingsFile');b.disabled=true;r.querySelector('#notice').textContent='Opening configuration file…';try{await api('/api/open-settings',{method:'POST',body:'{}'});r.querySelector('#notice').textContent='Opened in your default editor.'}catch(e){r.querySelector('#notice').textContent=e.message}finally{b.disabled=false}});
  r.querySelector('#browse').onclick=async()=>{const b=r.querySelector('#browse');b.disabled=true;r.querySelector('#notice').textContent='Opening folder picker…';try{const result=await api('/api/browse',{method:'POST',body:'{}'});if(!result.cancelled){r.querySelector('#rootPath').value=result.path;r.querySelector('#notice').textContent='Folder selected.'}else r.querySelector('#notice').textContent='Selection cancelled.'}catch(e){r.querySelector('#notice').textContent=e.message}finally{b.disabled=false}};
  r.querySelector('#save').onclick=async()=>{const b=r.querySelector('#save');b.disabled=true;r.querySelector('#notice').textContent='Scanning…';try{const payload={root:r.querySelector('#rootPath').value.trim(),name:r.querySelector('#workspaceName').value.trim()};await api(add?'/api/workspaces':'/api/settings',{method:'POST',body:JSON.stringify(add?{...payload,action:'add'}:payload)});await refresh();close()}catch(e){r.querySelector('#notice').textContent=e.message}finally{b.disabled=false}};
  r.querySelector('#removeWorkspace')?.addEventListener('click',async()=>{if(!current||state.workspaces.length<2)return;if(!confirm(`Remove “${current.name}” from Floorplan? Its folder and files will not be deleted.`))return;const b=r.querySelector('#removeWorkspace');b.disabled=true;try{await api('/api/workspaces',{method:'POST',body:JSON.stringify({action:'remove',id:current.id})});selected=null;await refresh();close()}catch(e){r.querySelector('#notice').textContent=e.message;b.disabled=false}});
  r.querySelector('#rootPath').focus()
}
const themeButton=document.querySelector('#themeToggle'),themeOrder=['auto','light','dark'],themeGlyph={auto:'◐',light:'☼',dark:'☾'};function showTheme(){const t=window.floorplanTheme.get();themeButton.textContent=themeGlyph[t];themeButton.title=`Theme: ${t[0].toUpperCase()+t.slice(1)}. Press to change.`;themeButton.setAttribute('aria-label',themeButton.title)}themeButton.onclick=()=>{const current=window.floorplanTheme.get();window.floorplanTheme.set(themeOrder[(themeOrder.indexOf(current)+1)%themeOrder.length])};window.addEventListener('floorplan-theme-change',showTheme);showTheme();
document.querySelector('#sidebar').classList.toggle('closed',closed);document.querySelector('#hamb').onclick=()=>{closed=!closed;document.querySelector('#sidebar').classList.toggle('closed',closed)};document.querySelector('#settingsTop').onclick=()=>settings(false);document.querySelector('#workspaceAdd').onclick=()=>settings(true);document.querySelector('#workspaceSelect').onchange=async e=>{try{await api('/api/workspaces',{method:'POST',body:JSON.stringify({action:'select',id:e.target.value})});selected=null;await refresh()}catch(error){alert(error.message);await refresh()}};refresh().catch(e=>{const content=document.querySelector('#content');content.setAttribute('aria-busy','false');content.innerHTML=`<section class="welcome" role="alert"><h1>Couldn't load this workspace</h1><p>${esc(e.message)}</p></section>`;document.querySelector('#tree').setAttribute('aria-busy','false');document.querySelector('#tree').replaceChildren()});setInterval(()=>refresh().catch(()=>{}),5000);
</script></body></html>
